name: CI

on:
  # Automatic triggers (push / pull_request / schedule / release /
  # workflow_run / ...) were removed on 2026-10-31. This workflow now
  # runs only when started by hand: Actions tab -> Run workflow, or
  # `gh workflow run <file>`.
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run verify:package
